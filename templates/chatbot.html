<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎬 動畫查詢助手</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Microsoft JhengHei", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .chat-container {
        width: 100%;
        max-width: 600px;
        height: 80vh;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .chat-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
      }

      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: #f8f9fa;
      }

      .message {
        margin-bottom: 15px;
        display: flex;
        animation: fadeIn 0.3s;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        justify-content: flex-end;
      }

      .message.bot {
        justify-content: flex-start;
      }

      .message-bubble {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 18px;
        word-wrap: break-word;
      }

      .message.user .message-bubble {
        background: #667eea;
        color: white;
        border-bottom-right-radius: 4px;
      }

      .message.bot .message-bubble {
        background: white;
        color: #333;
        border-bottom-left-radius: 4px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .anime-result {
        background: #f8f9fa;
        padding: 12px;
        margin-top: 8px;
        border-radius: 10px;
        border-left: 3px solid #667eea;
      }

      .anime-title {
        font-weight: bold;
        color: #333;
        margin-bottom: 5px;
      }

      .anime-info {
        font-size: 13px;
        color: #777;
        margin-bottom: 8px;
      }

      .platform-buttons {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .platform-btn {
        padding: 4px 12px;
        font-size: 12px;
        border-radius: 5px;
        text-decoration: none;
        color: white;
        transition: all 0.2s;
      }

      .platform-btn.anime1 {
        background: #27ae60;
      }
      .platform-btn.anime1:hover {
        background: #229954;
      }
      .platform-btn.bahamut {
        background: #3498db;
      }
      .platform-btn.bahamut:hover {
        background: #2980b9;
      }
      .platform-btn.youtube {
        background: #ff0000;
      }
      .platform-btn.youtube:hover {
        background: #cc0000;
      }

      .chat-input-container {
        padding: 15px;
        background: white;
        border-top: 1px solid #e0e0e0;
        display: flex;
        gap: 10px;
      }

      .chat-input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 25px;
        outline: none;
        font-size: 14px;
        transition: border 0.3s;
      }

      .chat-input:focus {
        border-color: #667eea;
      }

      .send-btn {
        padding: 12px 24px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.3s;
      }

      .send-btn:hover {
        background: #5568d3;
      }

      .send-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .typing-indicator {
        display: none;
        padding: 10px 16px;
        background: white;
        border-radius: 18px;
        width: fit-content;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .typing-indicator.show {
        display: block;
      }

      .typing-indicator span {
        height: 8px;
        width: 8px;
        background: #999;
        border-radius: 50%;
        display: inline-block;
        margin: 0 2px;
        animation: typing 1.4s infinite;
      }

      .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-10px);
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">🎬 動畫查詢助手</div>

      <div class="chat-messages" id="chatMessages">
        <!-- 歡迎訊息 -->
        <div class="message bot">
          <div class="message-bubble">
            你好！我是動畫查詢助手 🎬<br /><br />
            你可以問我：<br />
            • 「2024 年有什麼魔女動畫？」<br />
            • 「第4季的間諜動畫」<br />
            • 「沉默魔女在哪看？」
          </div>
        </div>

        <!-- 打字中指示器 -->
        <div class="message bot">
          <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>

      <div class="chat-input-container">
        <input
          type="text"
          class="chat-input"
          id="chatInput"
          placeholder="輸入訊息..."
          autocomplete="off"
        />
        <button class="send-btn" id="sendBtn">送出</button>
      </div>
    </div>

    <script>
      const chatMessages = document.getElementById("chatMessages");
      const chatInput = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const typingIndicator = document.getElementById("typingIndicator");

      // 發送訊息
      async function sendMessage() {
        const message = chatInput.value.trim();

        if (!message) return;

        // 顯示使用者訊息
        addMessage("user", message);

        // 清空輸入框
        chatInput.value = "";

        // 禁用按鈕和輸入框
        sendBtn.disabled = true;
        chatInput.disabled = true;

        // 顯示打字中
        typingIndicator.classList.add("show");
        scrollToBottom();

        try {
          // 呼叫 API
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ message: message }),
          });

          const data = await response.json();

          // 隱藏打字中
          typingIndicator.classList.remove("show");

          // 顯示機器人回應
          if (data.type === "chat") {
            addMessage("bot", data.message);
          } else if (data.type === "search") {
            addSearchResults(data);
          }
        } catch (error) {
          console.error("Error:", error);
          typingIndicator.classList.remove("show");
          addMessage("bot", "抱歉，發生錯誤了 😢");
        } finally {
          // 重新啟用
          sendBtn.disabled = false;
          chatInput.disabled = false;
          chatInput.focus();
        }
      }

      // 新增訊息到聊天室
      function addMessage(sender, text) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${sender}`;

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.innerHTML = text.replace(/\n/g, "<br>");

        messageDiv.appendChild(bubble);
        chatMessages.insertBefore(messageDiv, typingIndicator.parentElement);

        scrollToBottom();
      }

      // 新增搜尋結果
      function addSearchResults(data) {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message bot";

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";

        let html = `找到 <strong>${data.count}</strong> 部動畫`;

        if (data.results.length === 0) {
          html += "<br><br>沒有找到相關動畫 😢";
        } else {
          data.results.forEach((anime) => {
            html += `
                          <div class="anime-result">
                              <div class="anime-title">${anime.title}</div>
                              <div class="anime-info">${anime.year}年 第${anime.season}季</div>
                              <div class="platform-buttons">
                                  <a href="${anime.platform_urls.anime1}" target="_blank" class="platform-btn anime1">Anime1</a>
                                  <a href="${anime.platform_urls.bahamut}" target="_blank" class="platform-btn bahamut">巴哈姆特</a>
                                  <a href="${anime.platform_urls.youtube}" target="_blank" class="platform-btn youtube">YouTube</a>
                              </div>
                          </div>
                      `;
          });
        }

        bubble.innerHTML = html;
        messageDiv.appendChild(bubble);
        chatMessages.insertBefore(messageDiv, typingIndicator.parentElement);

        scrollToBottom();
      }

      // 滾動到底部
      function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // 事件監聽
      sendBtn.addEventListener("click", sendMessage);

      chatInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          sendMessage();
        }
      });

      // 自動聚焦
      chatInput.focus();
    </script>
  </body>
</html>
