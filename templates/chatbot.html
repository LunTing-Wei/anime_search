<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎬 動畫查詢助手</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/chatbot.css') }}"
    />
    <script
      src="{{ url_for('static', filename='js/chatbot.js') }}"
      defer
    ></script>
  </head>
  <body>
    <div class="chat-container">
      <div
        class="chat-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <span>🎬 動畫查詢助手</span>
        <a
          href="/favorites"
          style="color: white; text-decoration: none; font-size: 14px"
          >❤️ 我的收藏</a
        >
      </div>

      <div class="chat-messages" id="chatMessages">
        <!-- 歡迎訊息 -->
        <div class="message bot">
          <div class="message-bubble">
            你好！我是動畫查詢助手 🎬<br /><br />
            你可以問我：<br />
            • 「2024 年有什麼魔女動畫？」<br />
            • 「第4季的間諜動畫」<br />
            • 「沉默魔女在哪看？」
          </div>
        </div>

        <!-- 打字中指示器 -->
        <div class="message bot">
          <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>

      <div class="chat-input-container">
        <input
          type="text"
          class="chat-input"
          id="chatInput"
          placeholder="輸入訊息..."
          autocomplete="off"
        />
        <button class="send-btn" id="sendBtn">送出</button>
      </div>
    </div>
  </body>
</html>
